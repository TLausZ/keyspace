<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2^256, Zoom durch die Grössenordnungen</title>
<style>
  @font-face {
    font-family: 'EB Garamond';
    src: url('fonts/EBGaramond-latin.woff2') format('woff2');
    font-weight: 400 700;
    font-display: swap;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #ece2cd;
    color: #8a7a5e;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    overflow: hidden;
  }

  /* fixed stage: the modal fills the viewport with a page margin */
  .stage {
    position: fixed;
    inset: 16px;
    border: 1px solid rgba(110,92,64,0.25);
    border-radius: 4px;
    background: #ece2cd;
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }

  /* ---- header: the exponent pair, always visible, only its values change ---- */
  .readout {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 18px 24px 16px;
    border-bottom: 1px solid rgba(110,92,64,0.25);
  }
  .lang {
    position: absolute;
    top: 6px;
    right: 24px;
    display: flex;
    gap: 6px;
    font: 400 11px ui-sans-serif, system-ui, sans-serif;
  }
  .lang button {
    background: none; border: none; padding: 0;
    font: inherit; letter-spacing: 0.08em;
    color: #8a7a5e; cursor: pointer;
  }
  .lang button.active { color: #5c4a34; font-weight: 600; }
  .lang button:hover { text-decoration: underline; }
  .lang .sep { color: rgba(110,92,64,0.4); }
  .readout .power {
    font-family: 'EB Garamond', serif;
    font-size: 56px;
    line-height: 1;
    color: #5c4a34;
  }
  .readout .approx {
    font-family: 'EB Garamond', serif;
    font-size: 36px;
    line-height: 1;
    color: #8a7a5e;
  }
  .readout sup { font-size: 0.55em; vertical-align: super; line-height: 0; }
  .readout .count { font-size: 14px; align-self: flex-end; padding-bottom: 4px; }
  .readout .station {
    margin-left: auto;
    font-family: 'EB Garamond', serif;
    font-size: 30px;
    font-weight: 600;
    color: #5c4a34;
  }

  /* ---- body: scale | text | plate ---- */
  .body {
    display: grid;
    grid-template-columns: 92px 1fr 1fr;
    min-height: 0;
  }

  /* ---- scale column: one rail, evenly spaced stations ---- */
  .scale {
    position: relative;
    border-right: 1px solid rgba(110,92,64,0.25);
  }
  .scale svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scale .rail-line { stroke: rgba(110,92,64,0.4); fill: none; }
  .scale .tick { stroke: rgba(110,92,64,0.4); }

  .scale .label {
    position: absolute;
    left: 4px;
    right: 44px;
    padding: 6px 8px 6px 0;   /* target height stays under the row spacing so rows cannot overlap */
    border-radius: 4px;
    text-align: right;
    font-size: 12px;
    white-space: nowrap;
    color: #5c4a34;
    transform: translateY(-50%);
  }
  .scale .label:hover { background: rgba(110,92,64,0.12); cursor: pointer; }
  /* native vertical range: the thumb is the knob, so drag, click and keys come for free.
     The box is grown by one thumb at both ends so thumb centres meet the rail ticks. */
  .scale .slider {
    position: absolute;
    left: 51.5px;              /* EVEN_X 66 minus half a thumb */
    width: 29px;
    top: calc(4.2% - 14.5px);
    height: calc(91.6% + 29px);
    margin: 0;
    writing-mode: vertical-lr; /* min at the top; adding direction:rtl would flip it */
    appearance: none;
    background: none;
  }
  .scale .slider::-webkit-slider-runnable-track { background: none; }
  .scale .slider::-webkit-slider-thumb {
    appearance: none;
    width: 29px;
    height: 29px;
    /* inverted like an active nav-button: the one grabbable thing on the page
       must outrank the passive ticks, so it carries the page's strongest contrast */
    border: 1px solid #5c4a34;
    border-radius: 4px;
    background:
      repeating-linear-gradient(rgba(242,234,214,0.5) 0 1px, transparent 1px 6px) content-box,
      linear-gradient(#5c4a34, #5c4a34) padding-box;
    box-sizing: border-box;
    padding: 7px 6px;
    cursor: grab;
  }
  .scale .slider:active::-webkit-slider-thumb { cursor: grabbing; }
  .scale .slider:focus { outline: none; }
  .scale .slider:focus-visible::-webkit-slider-thumb {
    outline: 1px solid rgba(120,70,40,0.85);
    outline-offset: 2px;
  }

  /* ---- text column: the slider drives the track offset ---- */
  .text {
    position: relative;
    border-right: 1px solid rgba(110,92,64,0.25);
    overflow: hidden;
  }
  .text .track {
    padding: 40px 28px 40px 24px;
    display: flex;
    flex-direction: column;
    gap: 34px;
    transition: transform 620ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .entry {
    max-width: 56ch;
    padding-left: 14px;
    border-left: 1px solid transparent;
    opacity: 0.3;
    transition: opacity 420ms ease-out, border-left-color 420ms ease-out;
  }
  .entry.current { opacity: 1; border-left-color: rgba(150,90,50,0.95); }
  .entry h2 {
    font-family: 'EB Garamond', serif;
    font-size: 24px;
    font-weight: 600;
    color: #5c4a34;
    margin-bottom: 2px;
  }
  .entry .meta { font-size: 14px; margin-bottom: 12px; }
  .entry p {
    font-size: 16px;
    line-height: 1.6;
    color: #6b5a42;
    margin-bottom: 8px;
  }
  .entry .factor { font-size: 14px; color: rgba(150,90,50,0.95); }
  .fade-top, .fade-bottom {
    position: absolute;
    left: 0;
    right: 0;
    height: 64px;
    pointer-events: none;
  }
  .fade-top { top: 0; background: linear-gradient(#ece2cd, rgba(236,226,205,0)); }
  .fade-bottom { bottom: 0; background: linear-gradient(rgba(236,226,205,0), #ece2cd); }

  /* ---- plate: images enter from the right, leave to the left ---- */
  .plate { position: relative; overflow: hidden; }
  .slot {
    position: absolute;
    top: 50%;
    left: 8%;
    width: 84%;
    transform: translate(0, -50%);
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: center;
  }
  .frame {
    flex: 1;
    aspect-ratio: 1 / 1;
    max-height: 62vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .frame .label {
    font-family: 'EB Garamond', serif;
    font-size: 20px;
    font-weight: 600;
    color: #5c4a34;
    text-align: center;
    padding: 0 10px;
  }
  .frame .hint { font-size: 12px; }
  .frame .art { width: 97.5%; height: auto; }
  .slot .howto {
    position: absolute;
    bottom: 100%;
    left: 0;
    right: 0;
    margin-bottom: 22px;
    text-align: center;
    font-size: 12px;
    color: #8a7a5e;
  }

  @media (max-width: 900px) {
    .body { grid-template-columns: 92px 1fr; }
    .plate { display: none; }
  }
  /* below this the rows are closer than a line of type: thin the labels out */
  @media (max-height: 420px) {
    .scale .label:not(.accent) { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .text .track, .entry { transition: none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="readout" id="readout">
    <span class="power" id="power"></span>
    <span class="approx" id="approx"></span>
    <span class="count" id="count"></span>
    <span class="station" id="station"></span>
    <div class="lang" aria-label="Sprache">
      <button data-lang="de">DE</button><span class="sep">|</span><button data-lang="en">EN</button>
    </div>
  </div>

  <div class="body">
    <div class="scale" id="scale">
      <svg viewBox="0 0 92 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
      <input class="slider" id="slider" type="range" min="0" max="1" step="1" value="0"
             autocomplete="off" aria-label="Station wählen">
    </div>

    <div class="text" id="text">
      <div class="track" id="track"></div>
      <div class="fade-top"></div>
      <div class="fade-bottom"></div>
    </div>

    <div class="plate" id="plate">
    </div>
  </div>
</div>

<script>

      'Only here is the keyspace full: 2.1 billion galaxies the size of our own.',
      'Every Bitcoin key that can exist is one atom of it.'] },
  266: { name: 'The observable universe', count: 'an 81-digit number',
    factor: '×1,024 over the 2<sup>256</sup> keyspace',
    labels: ['The observable universe, logarithmic illustration by Pablo Carlos Budassi'],
    text: [
      'Around 10<sup>80</sup> atoms, two thousand billion galaxies. Ten steps above the 2<sup>256</sup> keyspace, and here the journey ends, for the observable reaches no further.',
      'Put differently: roughly one atom in a thousand in the universe is a Bitcoin key.'] },
};

// deep links: #<lang>/<station>, e.g. #de/coldcard, #en/milky-way or #de/40 (exponent)
const SLUGS = ['atom', 'protein', 'small-virus', 'large-virus', 'bacterium', 'coldcard',
  'cell', 'sand-grain', 'drop', 'human', 'humanity', 'lake-superior', 'oceans-moon',
  'jupiter', 'sun', 'milky-way', 'galaxies', 'universe'];
const hashParts = location.hash.slice(1).toLowerCase().split('/').filter(Boolean);
const hashLang = hashParts.find(p => p === 'de' || p === 'en');
const hashStation = hashParts.find(p => p !== 'de' && p !== 'en');

let lang = hashLang || localStorage.getItem('lang') || 'en';
const tr = s => lang === 'de' ? s
  : { ...s, ...EN[s.exp], approx: s.approx.replace(',', '.'),
      images: s.images.map((im, k) => ({ ...im, label: EN[s.exp].labels[k] })) };

const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const T_PLATE = CALM ? 0 : 620;
const T_READ = CALM ? 0 : 170;
const EASE = 'cubic-bezier(0.4, 0, 0.2, 1)';

let current = SLUGS.indexOf(hashStation);
if (current < 0) current = STATIONS.findIndex(s => String(s.exp) === hashStation);
if (current < 0) current = 0;

const updateHash = () => history.replaceState(null, '', '#' + lang + '/' + SLUGS[current]);

const $ = id => document.getElementById(id);
const [readout, power, approx, count, station, scale, slider, track, plate, text] =
  ['readout', 'power', 'approx', 'count', 'station', 'scale', 'slider', 'track', 'plate', 'text'].map($);

const RAIL_TOP = 42, RAIL_BOTTOM = 958, EVEN_X = 66;
const yEven = i => RAIL_TOP + (RAIL_BOTTOM - RAIL_TOP) * i / (STATIONS.length - 1);
const svgNs = 'http://www.w3.org/2000/svg';

function drawScale() {
  const svg = scale.querySelector('svg');
  const add = (parent, attrs, cls) => {
    const el = document.createElementNS(svgNs, 'line');
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    el.setAttribute('vector-effect', 'non-scaling-stroke');
    el.setAttribute('class', cls);
    parent.appendChild(el);
  };

  add(svg, { x1: EVEN_X, y1: RAIL_TOP, x2: EVEN_X, y2: RAIL_BOTTOM }, 'rail-line');

  STATIONS.forEach((s, i) => {
    const ye = yEven(i);
    add(svg, { x1: EVEN_X - 6, y1: ye, x2: EVEN_X + 6, y2: ye }, 'tick');

    const label = document.createElement('div');
    label.className = 'label' + (s.accent ? ' accent' : '');
    label.innerHTML = '2<sup>' + s.exp + '</sup>';
    label.style.top = (100 * ye / 1000) + '%';
    label.addEventListener('click', () => goTo(i));
    scale.appendChild(label);
  });
}

function drawText() {
  const atoms = lang === 'de' ? 'Atome' : 'atoms';
  track.innerHTML = STATIONS.map(raw => {
    const s = tr(raw);
    return `
    <div class="entry">
      <h2>${s.name}</h2>
      <div class="meta">2<sup>${s.exp}</sup> ≈ ${s.approx} ${atoms}</div>
      ${s.text.map(p => `<p>${p}</p>`).join('')}
      ${s.factor ? `<div class="factor">${s.factor}</div>` : ''}
    </div>`;
  }).join('');
  measureText();
}

// offsets that put an entry's centre on the reading line; recomputed whenever the text reflows
let offsets = [];
function measureText() {
  const half = track.parentElement.clientHeight / 2;
  offsets = [...track.children].map(e => e.offsetTop + e.offsetHeight / 2 - half);
}

function showText(i) {
  [...track.children].forEach((e, k) => e.classList.toggle('current', k === i));
  track.style.transform = `translateY(${-offsets[i]}px)`;
}

// the plate keeps exactly one live slot; the outgoing one leaves opposite to the travel direction
function showPlate(i, dir) {
  plate.querySelectorAll('.slot.out').forEach(el => el.remove());
  const old = plate.querySelector('.slot');
  const slot = document.createElement('div');
  slot.className = 'slot';
  const howto = i !== 0 ? '' : `<div class="howto">${lang === 'de'
    ? 'Scrollen, Pfeiltasten ↑↓ oder die Skala links führen durch die Stationen'
    : 'Scroll, use the arrow keys ↑↓, or pick a station on the scale to the left'}</div>`;
  slot.innerHTML = howto + tr(STATIONS[i]).images.map(n => typeof n === 'string'
    ? `<div class="frame"><span class="label">${n}</span><span class="hint">Bild folgt</span></div>`
    : `<div class="frame"><img class="art" src="${n.src}" alt="${n.label}"></div>`
  ).join('');
  plate.appendChild(slot);

  if (!old || !T_PLATE) { old?.remove(); return; }
  const from = dir >= 0 ? 80 : -80;
  slot.animate([
    { transform: `translate(${from}%, -50%)`, opacity: 0 },
    { transform: 'translate(0, -50%)', opacity: 1 }
  ], { duration: T_PLATE, easing: EASE });
  old.classList.add('out');
  old.animate([
    { transform: 'translate(0, -50%)', opacity: 1 },
    { transform: `translate(${-from}%, -50%)`, opacity: 0 }
  ], { duration: T_PLATE, easing: EASE, fill: 'forwards' })
    .finished.then(() => old.remove(), () => {});
}

// the readout dips instead of cutting; seq drops swaps overtaken by a newer one
let seq = 0;
function showReadout(i) {
  const write = () => {
    const s = tr(STATIONS[i]);
    power.innerHTML = '2<sup>' + s.exp + '</sup>';
      approx.innerHTML = '≈ ' + s.approx;
    count.textContent = s.count;
    station.textContent = s.name;
  };
  if (!T_READ) return write();
  const mine = ++seq;
  readout.getAnimations().forEach(a => a.cancel());
  readout.animate([{ opacity: 1 }, { opacity: 0.15 }, { opacity: 1 }],
    { duration: 2 * T_READ, easing: 'ease-in-out' });
  setTimeout(() => { if (mine === seq) write(); }, T_READ);
}

function goTo(i, dir) {
  i = Math.max(0, Math.min(STATIONS.length - 1, i));
  if (i === current) return;
  dir = dir ?? Math.sign(i - current);
  current = i;
  updateHash();
  slider.value = i;
  showReadout(i);
  showText(i);
  showPlate(i, dir);
}

drawScale();
drawText();
showText(current);
showPlate(current, 1);
showReadout(current);

// one station costs a fixed amount of scrolling, so a flick does not race through the list
const WHEEL_STEP = 500;
const WHEEL_IDLE = 400;
const WHEEL_COOLDOWN = 260;
let wheelSum = 0, wheelSeen = 0, wheelAt = 0;

function onWheel(e) {
  e.preventDefault();
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;   // vertical gestures only
  const now = performance.now();
  const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
  if (now - wheelSeen > WHEEL_IDLE || Math.sign(dy) !== Math.sign(wheelSum)) wheelSum = 0;
  wheelSeen = now;
  wheelSum += dy;
  if (Math.abs(wheelSum) < WHEEL_STEP || now - wheelAt < WHEEL_COOLDOWN) return;
  const dir = Math.sign(wheelSum);
  wheelSum = 0;
  wheelAt = now;
  goTo(current + dir, dir);
}
[text, plate, scale].forEach(el => el.addEventListener('wheel', onWheel, { passive: false }));

slider.max = STATIONS.length - 1;
slider.value = current;
slider.addEventListener('input', () => goTo(+slider.value));

// language switch: re-renders text, readout and plate in place; the station is kept
const langBtns = document.querySelectorAll('.lang button');
function setLang(l, init) {
  lang = l;
  localStorage.setItem('lang', l);
  document.documentElement.lang = l === 'de' ? 'de-CH' : 'en';
  document.title = l === 'de' ? '2^256, Zoom durch die Grössenordnungen'
                              : '2^256, a zoom through the orders of magnitude';
  slider.setAttribute('aria-label', l === 'de' ? 'Station wählen' : 'Choose a station');
  langBtns.forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  updateHash();
  if (init) return;                         // first render below already uses `lang`
  drawText();
  const t = track.style.transition;
  track.style.transition = 'none';
  showText(current);
  track.offsetHeight;
  track.style.transition = t;
  plate.querySelector('.slot')?.remove();   // swap the plate without a travel animation
  showPlate(current, 1);
  showReadout(current);
}
setLang(lang, true);
langBtns.forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

addEventListener('keydown', e => {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();                       // keep the focused slider from double-stepping
  const dir = e.key === 'ArrowDown' ? 1 : -1;
  goTo(current + dir, dir);
});

addEventListener('resize', () => {
  measureText();
  const t = track.style.transition;
  track.style.transition = 'none';
  showText(current);
  track.offsetHeight;
  track.style.transition = t;
});
</script>
</body>
</html>
